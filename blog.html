<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章 · 拾光小栈</title>
  <meta name="description" content="拾光小栈的全部文章：技术笔记、读书心得与生活随笔。支持搜索与标签筛选。">
  <meta name="theme-color" content="#faf7f2">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.dataset.theme = "dark";
        else if (t === "light") document.documentElement.dataset.theme = "light";
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="blog">
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="site-header">
    <nav class="nav container">
      <a class="brand" href="index.html"><span class="brand-seal">拾</span>拾光小栈</a>
      <ul class="nav-links">
        <li><a href="index.html" data-page="home">首页</a></li>
        <li><a href="blog.html" data-page="blog">文章</a></li>
        <li><a href="archive.html" data-page="archive">归档</a></li>
        <li><a href="projects.html" data-page="projects">项目</a></li>
        <li><a href="links.html" data-page="links">友链</a></li>
        <li><a href="about.html" data-page="about">关于</a></li>
      </ul>
      <div class="nav-actions">
        <button class="icon-btn js-open-search" aria-label="搜索文章" title="搜索 (Ctrl+K)">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
        <button class="icon-btn js-toggle-theme" aria-label="切换主题" title="切换明暗主题">
          <svg viewBox="0 0 24 24" class="icon-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg viewBox="0 0 24 24" class="icon-moon"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
        <button class="icon-btn nav-burger js-toggle-menu" aria-label="打开菜单">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </nav>
  </header>

  <main id="main" class="container">
    <div class="page-head">
      <h1>文章</h1>
      <p>所有写过的东西都收在这里，也可以按 <span class="kbd">Ctrl</span> + <span class="kbd">K</span> 全站搜索。</p>
    </div>

    <div class="filter-bar">
      <label class="search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="blogSearch" type="text" placeholder="筛选：标题 / 摘要 / 标签…" aria-label="筛选文章">
      </label>
      <div class="tag-filter" id="tagFilter"></div>
      <span class="result-count" id="postCount"></span>
    </div>

    <ul class="row-list" id="postList"></ul>

    <div class="empty-state" id="emptyState" hidden>
      <p>没有匹配的文章，换个关键词试试。</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner container">
      <span>© <span data-year>2026</span> 拾光小栈</span>
      <span class="spacer"></span>
      <div class="footer-socials">
        <a class="icon-btn" href="https://github.com/cxjcom" target="_blank" rel="noopener" aria-label="GitHub 主页">
          <svg viewBox="0 0 24 24" class="fill"><path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.9 10.9c.6.1.8-.2.8-.5v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.4-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.2c0 .3.2.6.8.5A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5Z"/></svg>
        </a>
        <a class="icon-btn" href="mailto:hello@example.com" aria-label="发邮件">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        </a>
        <a class="icon-btn" href="feed.xml" aria-label="RSS 订阅">
          <svg viewBox="0 0 24 24"><path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1.2" fill="currentColor" stroke="none"/></svg>
        </a>
      </div>
      <a href="about.html">关于本站</a>
    </div>
  </footer>

  <script src="assets/js/posts.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
