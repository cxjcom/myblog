  <script>
    (function () {
      const groupsBox = document.getElementById("themeGroups");
      const cats = ["默认", "科技未来", "自然", "宇宙"];
      const minis = [];

      function render() {
        const active = document.documentElement.dataset.bg || "aurora";
        minis.forEach((stop) => stop());
        minis.length = 0;
        groupsBox.innerHTML = cats
          .map((cat) => {
            const items = window.BG_THEMES.filter((t) => t.cat === cat);
            if (!items.length) return "";
            return `<h2 class="group-title">${cat}</h2>
              <div class="theme-grid">
                ${items
                  .map(
                    (t) => `<button class="theme-card ${t.id === active ? "active" : ""}" data-id="${t.id}" type="button" aria-pressed="${t.id === active}">
                      <div class="theme-swatch" style="background:url('assets/img/bg/${t.id}.jpg?v=1.7.0') center/cover, ${t.swatch}"></div>
                      <div class="theme-card-body">
                        <h3>${t.name}${t.id === active ? '<span class="theme-badge">使用中</span>' : ""}</h3>
                        <p>${t.desc}</p>
                      </div>
                    </button>`
                  )
                  .join("")}
              </div>`;
          })
          .join("");
        /* 卡片内的小画布也用同一套画师实时渲染 */
        document.querySelectorAll(".theme-card").forEach((card) => {
          const preset = window.BG_PRESETS[card.dataset.id];
          if (preset && preset.canvas && window.BG_PAINTERS[preset.canvas]) {
            const c = document.createElement("canvas");
            card.querySelector(".theme-swatch").appendChild(c);
            minis.push(window.BG_PAINTERS[preset.canvas](c, c.getContext("2d")));
          }
        });
      }

      groupsBox.addEventListener("click", (e) => {
        const card = e.target.closest(".theme-card");
        if (!card) return;
        applyBackground(card.dataset.id);
        render();
      });

      document.addEventListener("DOMContentLoaded", render);
    })();
  </script>
