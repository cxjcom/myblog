<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>写文章 · 拾光小栈</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0f0e">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7f4">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css?v=2.1.6">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.dataset.theme = "dark";
        else if (t === "light") document.documentElement.dataset.theme = "light";
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="write">
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="site-header">
    <nav class="nav container">
      <a class="brand" href="index.html"><span class="brand-dot"></span><span data-site-name>拾光小栈</span></a>
      <ul class="nav-links">
        <li><a href="index.html" data-page="home">首页</a></li>
        <li><a href="blog.html" data-page="blog" class="active">博客</a></li>
        <li><a href="archive.html" data-page="archive">归档</a></li>
        <li><a href="projects.html" data-page="projects">项目</a></li>
        <li><a href="links.html" data-page="links">导航</a></li>
        <li><a href="about.html" data-page="about">关于</a></li>
        <li><a href="album.html" data-page="album">相册</a></li>
        <li><a href="music.html" data-page="music">音乐</a></li>
        <li><a href="guestbook.html" data-page="guestbook">留言板</a></li>
        <li><a href="profile.html" data-page="me">我的</a></li>
      </ul>
      <div class="nav-actions">
        <button class="icon-btn js-toggle-theme" aria-label="切换主题" title="切换明暗主题">
          <svg viewBox="0 0 24 24" class="icon-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg viewBox="0 0 24 24" class="icon-moon"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
        <button class="icon-btn nav-burger js-toggle-menu" aria-label="打开菜单">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </nav>
  </header>

  <main id="main" class="container">
    <div class="page-head">
      <span class="kicker">Write</span>
      <h1>写<span class="gradient-text">文章</span></h1>
      <p id="writeHint">支持标题、粗体、引用、代码块、配图与视频，保存后自动同步到仓库并发布。</p>
    </div>

    <div class="glass-card write-card">
      <label class="form-row"><span>标题</span><input id="wTitle" maxlength="60" placeholder="文章标题"></label>
      <label class="form-row"><span>标签</span><input id="wTags" maxlength="60" placeholder="逗号分隔，如：随笔, 生活"></label>
      <label class="form-row"><span>日期</span><input id="wDate" type="date"></label>
      <label class="form-row"><span>摘要</span><input id="wSummary" maxlength="120" placeholder="留空则自动截取正文开头"></label>

      <div class="editor-toolbar" id="wToolbar">
        <button type="button" data-cmd="h2" title="标题">H2</button>
        <button type="button" data-cmd="p" title="正文段落">正文</button>
        <button type="button" data-cmd="bold" title="粗体 (Ctrl+B)"><b>B</b></button>
        <button type="button" data-cmd="italic" title="斜体 (Ctrl+I)"><i>I</i></button>
        <button type="button" data-cmd="blockquote" title="引用">引用</button>
        <button type="button" data-cmd="pre" title="代码块">代码</button>
        <button type="button" data-cmd="hr" title="分隔线">——</button>
        <button type="button" data-cmd="image" title="插入图片">🖼️ 图片</button>
        <input type="file" id="wImgFile" accept="image/*" hidden>
        <button type="button" data-cmd="video" title="插入视频（B站 / YouTube / mp4 链接）">🎬 视频</button>
        <span class="editor-count" id="wCount">0 字</span>
      </div>
      <div class="editor-body" id="wBody" contenteditable="true" data-placeholder="从这里开始写正文…"></div>

      <div class="form-actions">
        <button type="button" class="btn btn-primary" id="wPublish">发布文章</button>
        <button type="button" class="btn" id="wBack">返回列表</button>
        <button type="button" class="btn" id="wDelete" hidden>删除这篇文章</button>
      </div>
      <p class="form-note" id="wNote">草稿会自动保存在本机浏览器；点「发布文章」经本地服务器同步到 GitHub 仓库后，所有访客即可阅读。</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner container">
      <p>© <span data-year>2026</span> <span data-site-name>拾光小栈</span> · 由 <span class="heart">♥</span> 与好奇心驱动</p>
    </div>
  </footer>

  <script src="assets/js/posts.js?v=2.0.0"></script>
  <script src="assets/js/profile.js?v=2.0.0"></script>
  <script src="assets/js/main.js?v=2.0.0"></script>
  <script src="assets/js/write.js?v=2.0.0"></script>
  <script>if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js")})}</script>
</body>
</html>
